<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#08111f" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Electric Lightning Glow -->
    <filter id="electricGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes lightningTravel {
      0% {
        transform: translateX(-300px);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    @keyframes textFlash {
      0%, 100% {
        fill: #00F2FE;
        filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
      }
      25% {
        fill: #FFFFFF;
        filter: drop-shadow(0 0 20px #00F2FE) drop-shadow(0 0 35px #7C3AED);
      }
      50% {
        fill: #00F2FE;
        filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.8));
      }
      75% {
        fill: #E0F7FA;
        filter: drop-shadow(0 0 18px #00BFFF);
      }
    }

    @keyframes scanlineMove {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    @keyframes circuitPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.7; }
    }

    .main-title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 12px;
      animation: textFlash 4s infinite ease-in-out;
    }

    .hud-text {
      font-family: monospace;
      font-size: 10px;
      fill: #00F2FE;
      opacity: 0.35;
      letter-spacing: 2px;
    }

    .lightning-path {
      animation: lightningTravel 3.5s infinite linear;
    }

    .circuit-line {
      animation: circuitPulse 3s infinite ease-in-out;
    }
  </style>

  <!-- BACKGROUND RECT -->
  <rect width="1000" height="220" rx="12" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- HUD BORDER LINES -->
  <path d="M 30 20 L 70 20 M 30 20 L 30 50" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 970 20 L 930 20 M 970 20 L 970 50" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 30 200 L 70 200 M 30 200 L 30 170" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 970 200 L 930 200 M 970 200 L 970 170" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- FAINT HACKER BACKGROUND DETAILS -->
  <text x="40" y="45" class="hud-text">&gt; SYSTEM_ONLINE // SECURE_NODE_01</text>
  <text x="780" y="45" class="hud-text">01001001 10110100</text>
  <text x="40" y="190" class="hud-text">STATUS: ACTIVE_BUILDER</text>
  <text x="820" y="190" class="hud-text">LOC: FULL_STACK_AI</text>

  <!-- FAINT DECORATIVE CIRCUIT LINES -->
  <path class="circuit-line" d="M 100 110 L 220 110 L 250 140 M 750 140 L 780 110 L 900 110" stroke="#7C3AED" stroke-width="1.5" fill="none" opacity="0.35" stroke-dasharray="4 4"/>

  <!-- MAIN NAME DESIGN -->
  <g filter="url(#neonGlow)">
    <text x="500" y="128" text-anchor="middle" class="main-title">SHREYASH MEHTA</text>
  </g>

  <!-- ELECTRIC LIGHTNING STREAK ANIMATION -->
  <g class="lightning-path" filter="url(#electricGlow)">
    <path d="M 0 115 L 40 108 L 70 122 L 120 110 L 150 125 L 200 112 L 230 118 L 280 106" stroke="#00F2FE" stroke-width="3" fill="none" opacity="0.95"/>
    <path d="M 10 114 L 50 109 L 80 120 L 130 112 L 160 123 L 210 110 L 240 117 L 290 108" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>
</svg>
