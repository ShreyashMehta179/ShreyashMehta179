<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#07111f" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes lineEnergy {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes footerPulse {
      0%, 100% { fill: #00F2FE; filter: drop-shadow(0 0 6px #00F2FE); }
      50% { fill: #FFFFFF; filter: drop-shadow(0 0 16px #00F2FE) drop-shadow(0 0 25px #7C3AED); }
    }

    .footer-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 6px;
      animation: footerPulse 3.5s infinite ease-in-out;
    }

    .footer-sub {
      font-family: monospace;
      font-size: 11px;
      fill: #00BFFF;
      opacity: 0.8;
      letter-spacing: 3px;
    }

    .footer-bot {
      font-family: monospace;
      font-size: 10px;
      fill: #7C3AED;
      opacity: 0.7;
      letter-spacing: 2px;
    }

    .energy-line {
      stroke: #00F2FE;
      stroke-width: 2;
      stroke-dasharray: 200 400;
      animation: lineEnergy 3s infinite linear;
    }
  </style>

  <rect width="1000" height="160" rx="10" fill="url(#footerBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- HUD CORNERS -->
  <path d="M 25 20 L 55 20 M 25 20 L 25 45" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 975 20 L 945 20 M 975 20 L 975 45" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>

  <text x="35" y="38" class="footer-bot">&gt; SYSTEM_STATUS: ONLINE</text>
  <text x="790" y="38" class="footer-bot">01001001 10110100</text>

  <!-- MOVING ELECTRIC LINE -->
  <line x1="100" y1="58" x2="900" y2="58" stroke="#1E293B" stroke-width="2"/>
  <line x1="100" y1="58" x2="900" y2="58" class="energy-line" filter="url(#footerGlow)"/>

  <!-- MAIN FOOTER TEXT -->
  <g filter="url(#footerGlow)">
    <text x="500" y="100" text-anchor="middle" class="footer-title">BUILD • LEARN • SHIP • REPEAT 🚀</text>
  </g>

  <text x="500" y="125" text-anchor="middle" class="footer-sub">&gt; SYSTEM_SESSION COMPLETE</text>
  <text x="500" y="145" text-anchor="middle" class="footer-bot">SHREYASH MEHTA // CONNECTION_ACTIVE</text>
</svg>
